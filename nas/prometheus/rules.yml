groups:
  - name: gpu-lab
    rules:
      - record: lab:gpu_utilization:avg10m
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[10m])
      - record: lab:gpu_utilization:avg24h
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[24h])
      - record: lab:gpu_utilization:avg7d
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[7d])
      - record: lab:gpu_utilization:avg30d
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[30d])
      # One sample per busy GPU per Linux user; drops the pid label so GPU-hours do not double count.
      - record: lab:gpu_user_active:max
        expr: max by(server,gpu,user) (lab_gpu_process_info)
      - alert: GPUExporterDown
        expr: up{job=~"node-exporter|dcgm-exporter"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} exporter 연결 끊김'
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85 and DCGM_FI_DEV_GPU_TEMP < 1000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} GPU {{ $labels.gpu }} 온도 확인 필요'
      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0 and DCGM_FI_DEV_XID_ERRORS < 100000
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} GPU {{ $labels.gpu }} XID 오류'
      - alert: GPUServerOfflineProlonged
        expr: up{job=~"node-exporter|dcgm-exporter"} == 0
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.server }} exporter 30분 이상 연결 없음 · 관리자 확인 필요'
      # Reference notice only. Nothing stops the running job; students settle the handover.
      - alert: ReservedGPUUsedByOthers
        expr: lab_gpu_borrowed == 1
        for: 10m
        labels: {severity: info}
        annotations:
          summary: '{{ $labels.server }} GPU {{ $labels.gpu }} 예약 시간에 다른 사용자가 사용 중'
      - alert: PortalDown
        expr: up{job="gpu-portal"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '통합 포털 수집 중단 · 예약 대비 사용 통계가 비어집니다'
      - alert: ProcessCollectorStale
        expr: time() - lab_gpu_process_collector_timestamp_seconds > 90 or lab_gpu_process_collector_success == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.server }} 프로세스 수집 확인 필요'
