global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: gpu-portal
    static_configs:
      - targets: ['portal:8000']
  - job_name: node-exporter
    static_configs:
      - targets: ['CHANGE_ME_GPU_SERVER_1_IP:9100']
        labels: {server: gpu-server-1}
      - targets: ['CHANGE_ME_GPU_SERVER_2_IP:9100']
        labels: {server: gpu-server-2}
  - job_name: dcgm-exporter
    static_configs:
      - targets: ['CHANGE_ME_GPU_SERVER_1_IP:9400']
        labels: {server: gpu-server-1}
      - targets: ['CHANGE_ME_GPU_SERVER_2_IP:9400']
        labels: {server: gpu-server-2}
