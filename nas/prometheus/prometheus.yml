global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  # 포털이 판정한 예약·Busy 상태. 30초 간격을 유지해야 GPU-hour 환산이 맞습니다.
  - job_name: gpu-portal
    static_configs:
      - targets: ['portal:8000']

  # GPU 서버. node_exporter 하나가 CPU/RAM/Disk와 GPU 수치(수집기가 기록)를 함께 제공합니다.
  - job_name: node-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ['10.174.52.127:9100']
        labels: {server: igdsl-aurora}
      - targets: ['10.174.52.130:9100']
        labels: {server: igdsl-polaris}

  # 선택: NVIDIA DCGM Exporter를 따로 돌리는 경우에만 주석을 해제합니다.
  # - job_name: dcgm-exporter
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ['10.174.52.127:9400']
  #       labels: {server: igdsl-aurora}
  #     - targets: ['10.174.52.130:9400']
  #       labels: {server: igdsl-polaris}
