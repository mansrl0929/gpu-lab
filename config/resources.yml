# iGDSL 워크스테이션과 GPU 목록. 장비를 바꾸면 이 파일만 수정하고 포털을 재시작합니다.
# server 값은 nas/prometheus/prometheus.yml의 라벨과 반드시 같아야 합니다.
servers:
  - id: igdsl-aurora
    name: iGDSL-Aurora
    description: RTX PRO 6000 Blackwell × 4 · 대규모 학습
  - id: igdsl-polaris
    name: iGDSL-Polaris
    description: RTX A6000 × 2 · 학습 · 실험
resources:
  - {id: AURORA-GPU0, server: igdsl-aurora, gpu_index: '0', model: NVIDIA RTX PRO 6000 Blackwell, vram_gb: 96}
  - {id: AURORA-GPU1, server: igdsl-aurora, gpu_index: '1', model: NVIDIA RTX PRO 6000 Blackwell, vram_gb: 96}
  - {id: AURORA-GPU2, server: igdsl-aurora, gpu_index: '2', model: NVIDIA RTX PRO 6000 Blackwell, vram_gb: 96}
  - {id: AURORA-GPU3, server: igdsl-aurora, gpu_index: '3', model: NVIDIA RTX PRO 6000 Blackwell, vram_gb: 96}
  - {id: POLARIS-GPU0, server: igdsl-polaris, gpu_index: '0', model: NVIDIA RTX A6000, vram_gb: 48}
  - {id: POLARIS-GPU1, server: igdsl-polaris, gpu_index: '1', model: NVIDIA RTX A6000, vram_gb: 48}
# 포털 아이디와 GPU 서버의 Linux 계정이 다른 사람만 적습니다. 비우면 포털 아이디를 Linux 계정명으로 봅니다.
users: []
#  - {portal_username: munkiyeong, linux_username: munkiyeong, display_name: 문기영}
#  - {portal_username: kiyeong, linux_username: kiyeong, display_name: 문기영}
